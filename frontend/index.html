<!DOCTYPE html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0F" />
    <meta name="description" content="myGYM - Tu entrenador personal con IA. Plataforma fitness avanzada con planes personalizados, seguimiento de progreso y entrenador IA." />

    <!-- Open Graph -->
    <meta property="og:title" content="myGYM - Fitness con IA" />
    <meta property="og:description" content="Tu plataforma fitness con entrenador personal IA" />
    <meta property="og:type" content="website" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <title>myGYM - Tu Entrenador Personal IA</title>

    <style>
      /* Critical CSS for initial render */
      html, body, #root {
        margin: 0;
        padding: 0;
        height: 100%;
        background-color: #0A0A0F;
        color: #ffffff;
        font-family: 'Inter', system-ui, sans-serif;
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #12121A;
      }
      ::-webkit-scrollbar-thumb {
        background: #2A2A3E;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #00D4FF;
      }

      /* Loading screen */
      #loading-screen {
        position: fixed;
        inset: 0;
        background: #0A0A0F;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }

      .loading-logo {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }

      .loading-icon {
        width: 64px;
        height: 64px;
        border: 2px solid rgba(0, 212, 255, 0.2);
        border-top-color: #00D4FF;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      .loading-text {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 28px;
        font-weight: 700;
        background: linear-gradient(135deg, #00D4FF, #39FF14);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      /* Selection */
      ::selection {
        background: rgba(0, 212, 255, 0.3);
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <!-- Loading screen -->
    <div id="loading-screen">
      <div class="loading-logo">
        <div class="loading-icon"></div>
        <span class="loading-text">myGYM</span>
      </div>
    </div>

    <div id="root"></div>

    <script>
      // Remove loading screen when app loads
      window.addEventListener('load', () => {
        setTimeout(() => {
          const loadingScreen = document.getElementById('loading-screen');
          if (loadingScreen) {
            loadingScreen.style.opacity = '0';
            setTimeout(() => loadingScreen.remove(), 300);
          }
        }, 500);
      });
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
